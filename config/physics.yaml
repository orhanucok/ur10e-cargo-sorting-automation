schema_version: 1

box:
  minimum_size_m: [0.20, 0.15, 0.12]
  maximum_size_m: [0.40, 0.30, 0.25]
  minimum_mass_kg: 0.5
  maximum_mass_kg: 8.0
  center_of_mass_offset_limit_m: 0.03

contacts:
  cardboard_to_belt:
    static_friction: 0.45
    dynamic_friction: 0.34
    restitution: 0.04
    source: estimated
    calibration_required: true
  cardboard_to_orientation_station:
    static_friction: 0.58
    dynamic_friction: 0.46
    restitution: 0.03
    source: estimated
    calibration_required: true

vacuum:
  model: robotiq_epick_four_cup
  cup_count: 4
  cup_diameter_m: 0.055
  maximum_vacuum_kpa: 80.0
  nominal_seal_quality: 0.72
  tangential_friction: 0.65
  maximum_total_moment_nm: 150.0
  pump_rise_time_s: 0.35
  minimum_contact_ratio: 0.75
  source: manufacturer_plus_estimated_seal
  calibration_required: true

randomization:
  mass_fraction: 0.08
  friction_fraction: 0.12
  camera_latency_ms: [25, 80]
  camera_frame_drop_probability: 0.01
  conveyor_speed_fraction: 0.02

